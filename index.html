<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tote</title>

  <link rel="stylesheet" href="style.css?v=1.0.1">
</head>
<body>

  <div class="container">

    <div class="card">

      <h1>TOTE</h1>

      <div id="dropZone" class="drop-zone">
        Drag Inventory File Here
        <br>
        <span>or click to browse</span>
      </div>

      <input type="file" id="fileInput" hidden>

<div class="file-status">
  <div class="status-label">Inventory File:</div>
  <div id="fileStatus">No file selected</div>
</div>

      <button id="generateBtn" disabled>
        Generate Summary
      </button>

      <button id="printBtn" disabled>
  Print Summary
</button>

      <div class="technician-name-field">
        <label for="technicianName">Technician Name</label>
        <input type="text" id="technicianName" placeholder="Enter technician name">
      </div>

        <div id="results" class="results"></div>

    </div>

   

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js?v=2.1"></script>

   <div class="footer">
      Distribution In Motion &bull; TOTE Inventory Summary &bull; Version 2.1
    </div>
  
</body>
</html>
